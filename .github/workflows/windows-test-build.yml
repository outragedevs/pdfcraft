# Windows x64 test build for the outragedevs fork only; this file never goes upstream. It packages
# the branch with packaging/windows/package.ps1, the way the release workflow's Windows job does
# (unsigned: the fork has no signing secrets), and publishes the MSI and the portable zip as a
# pre-release of the fork so they can be downloaded without signing in.
name: Windows test build

on:
  push:
    branches: [test/windows-build]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: windows-test-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    if: github.repository == 'outragedevs/pdfcraft'
    name: Windows x64
    runs-on: windows-latest
    timeout-minutes: 120
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: 0
      RUST_BACKTRACE: 1
      PDFCRAFT_BUILD_LABEL: merkel.pr2633.pr2869
      PDFCRAFT_BUILD_SHA: ${{ github.sha }}
      # Fail instead of shipping an exe without its icon and version resources.
      PDFCRAFT_REQUIRE_WINRES: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check out craft-fonts
        uses: storytold/craft-common-actions/actions/checkout-craft-fonts@main
        with:
          # The pin release.yml uses.
          ref: b076417b5880bd4154bd22f00695b1d28c6bea83
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: windows-test-x64
      - name: Install WiX
        uses: storytold/craft-common-actions/actions/install-wix@main
        with:
          wix-version: "5.0.2"
      - name: Build and package
        shell: pwsh
        env:
          CRAFT_FONTS_DIR: ${{ github.workspace }}/craft-fonts
          CRAFT_FONTS_REQUIRED: "1"
        run: ./packaging/windows/package.ps1 -Arch x64
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pdfcraft-windows-x64
          path: dist/release/*
          if-no-files-found: error
      - name: Publish as a pre-release of the fork
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          short="${GITHUB_SHA::8}"
          gh release create "test-windows-$short" dist/release/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "PdfCraft test build $short (Windows x64)" \
            --notes "Unsigned test build of branch test/windows-build at $GITHUB_SHA: PdfCraft 0.14.0 (upstream main 64e0868b) with backgrounds placed below page content (storytold/pdfcraft#2633) and added images behind the page text (storytold/pdfcraft#2869); the single-page range fix (storytold/pdfcraft#2642) is part of upstream main. Not an official release. Windows SmartScreen will warn because the files are not signed."
